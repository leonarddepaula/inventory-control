# Application Configuration
spring.application.name=inventory-control-backend
server.port=8080

# Database Configuration - PostgreSQL (default)
spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_control
spring.datasource.username=leonardodepaula
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Alternative MySQL Configuration (uncomment to use MySQL)
#spring.datasource.url=jdbc:mysql://localhost:3306/inventory_control?useSSL=false&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=password
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 Database Configuration (for development/testing - uncomment to use)
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Alternative Hibernate Dialect for MySQL (uncomment if using MySQL)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*

# Validation Configuration
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
